name: Build Debug APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure stable debug keystore
        run: |
          git fetch origin main || true
          if git cat-file -e origin/main:debug.keystore 2>/dev/null; then
            echo "Taking committed debug.keystore from origin/main"
            git show origin/main:debug.keystore > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating one-time persistent debug.keystore"
            keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add -f debug.keystore
            git commit -m "CI: persistent debug keystore for stable updates" || true
            git push origin HEAD:main || true
          fi
          ls -l debug.keystore
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      - name: Install Android platform 36 + build-tools
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build Debug APK
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lockscreen-debug-apk
          path: app/build/outputs/apk/debug/*.apk
